
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Rune - Music</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="nav-logo">SERVER RUNE</a>

        <div class="nav-links">
            <a href="index.html">HOME</a>
            <a href="devlogs.html">DEVLOGS</a>
            <a href="music.html" class="active">MUSIC</a>
            <a href="gallery.html">GALLERY</a>
            <a href="contact.html">CONTACT US</a>
        </div>
    </nav>

    <main class="music">

        <h2>MUSIC</h2>

        <div class="music-list">

            <!-- MIKES -->
            <div class="music-track" data-bpm="86">

                <div class="track-info">

                    <button class="music-play">▶</button>

                    <div>
                        <h3>Mikes</h3>
                        <p>By Gravel</p>
                    </div>

                </div>

                <div class="track-progress">

                    <span class="track-current">0:00</span>

                    <input
                        class="progress-bar"
                        type="range"
                        min="0"
                        max="0"
                        value="0"
                        step="0.1"
                    >

                    <span class="track-duration">0:00</span>

                </div>

                <audio preload="metadata">
                    <source src="assets/music/Mikes.ogg" type="audio/ogg">
                </audio>

            </div>


            <!-- BOSSA NOVA -->
            <div class="music-track" data-bpm="80">

                <div class="track-info">

                    <button class="music-play">▶</button>

                    <div>
                        <h3>Bossa Nova</h3>
                        <p>By Porfilho</p>
                    </div>

                </div>

                <div class="track-progress">

                    <span class="track-current">0:00</span>

                    <input
                        class="progress-bar"
                        type="range"
                        min="0"
                        max="0"
                        value="0"
                        step="0.1"
                    >

                    <span class="track-duration">0:00</span>

                </div>

                <audio preload="metadata">
                    <source src="assets/music/bossanovaslop.mp3" type="audio/mpeg">
                </audio>

            </div>


            <!-- RUDE BUSTER -->
            <div class="music-track" data-bpm="140">

                <div class="track-info">

                    <button class="music-play">▶</button>

                    <div>
                        <h3>Rude Buster</h3>
                        <p>By Gravel</p>
                    </div>

                </div>

                <div class="track-progress">

                    <span class="track-current">0:00</span>

                    <input
                        class="progress-bar"
                        type="range"
                        min="0"
                        max="0"
                        value="0"
                        step="0.1"
                    >

                    <span class="track-duration">0:00</span>

                </div>

                <audio preload="metadata">
                    <source src="assets/music/Rude Buster.mp3" type="audio/mpeg">
                </audio>

            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
